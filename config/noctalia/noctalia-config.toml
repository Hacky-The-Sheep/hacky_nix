[notification]
background_opacity = 0.88999998010694981
position = "top_center"
scale = 1.0500000081956387

[plugins]
enabled = []

[shell]
app_icon_colorize = true
corner_radius_scale = 0.0
font_family = "Iosevka"
polkit_agent = true
ui_scale = 1.1000000089406967

    [shell.animation]
    enabled = false

    [shell.panel]
    transparency_mode = "glass"

[theme]
builtin = "Catppuccin"
community_palette = "Kanagawa Dragon"
mode = "dark"
source = "community"

    [theme.templates]
    builtin_ids = [ "btop", "gtk3", "gtk4", "ghostty", "helix", "hyprland", "niri" ]
    community_ids = [ "brave", "brave-origin", "discord" ]

[wallpaper.default]
path = "/home/hacky/Pictures/Wallpapers/Van.jpg"

[wallpaper.last]
path = "/home/hacky/Pictures/Wallpapers/Van.jpg"

[wallpaper.monitors.DP-5]
path = "/home/hacky/Pictures/Wallpapers/retro_wave_2.jpg"

[wallpaper.monitors.eDP-1]
path = "/home/hacky/Pictures/Wallpapers/Van.jpg"

[wallpaper.monitors.eDP-2]
path = "/home/hacky/Pictures/Wallpapers/mr_robot_2.png"

[widget.audio_visualizer]
show_when_idle = true

[widget.cat]
type = "noctalia/bongocat:cat"

[widget.clock]
format = "{:%a %b %d - %l:%M %p}"

[widget.control-center]
custom_image = "/home/hacky/Pictures/Icons/nixos.svg"
custom_image_colorize = true
scale = 1.2

[widget.session]
scale = 1.2
