[audio]
colorize_icons = true

[bar.default]
background_opacity = 0.24999999441206455
center = [ "clock", "notifications" ]
concave_edge_corners = false
end = [ "tray", "network", "bluetooth", "volume", "brightness", "battery", "control-center", "session" ]
font_scale = 0.98999998532235622
margin_ends = 20
padding = 16
radius = 0
shadow = false
start = [ "workspaces", "wallpaper", "audio_visualizer" ]
thickness = 36
widget_spacing = 8

[desktop_widgets]
enabled = false

[dock]
colorize_icons = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [
    "lockscreen-login-box@DP-4",
    "lockscreen-login-box@FALLBACK",
    "lockscreen-login-box@DP-5",
    "lockscreen-login-box@winit"
]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-10"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "DP-10"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-10".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_media_controls = true
        show_password_reveal = true
