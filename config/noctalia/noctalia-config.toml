[notification]
background_opacity = 0.88999998010694981
colorize_icons = true
position = "top_center"
scale = 1.0500000081956387

[plugins]
enabled = []

[shell]
colorize_icons = true
corner_radius_scale = 0.35000000521540642
font_family = "Departure Mono"
polkit_agent = true
polkit_colorize_icons = true
screen_time_colorize_icons = true
ui_scale = 1.1000000089406967

    [shell.animation]
    enabled = false

    [shell.launcher]
    colorize_icons = true

    [shell.panel]
    transparency_mode = "glass"

    [shell.window_switcher]
    colorize_icons = true

[theme]
builtin = "Catppuccin"
community_palette = "Monochrome"
mode = "dark"
source = "community"

    [theme.templates]
    builtin_ids = [ "alacritty", "btop", "gtk3", "gtk4", "ghostty", "helix", "hyprland", "niri", "qt" ]
    community_ids = [ "brave", "brave-origin", "discord", "libreoffice", "fastfetch", "thunar", "bat" ]

[wallpaper]
directory = "/home/hacky/Pictures/Wallpapers"

    [wallpaper.default]
    path = "/home/hacky/Pictures/Wallpapers/waves.jpg"

    [wallpaper.last]
    path = "/home/hacky/Pictures/Wallpapers/waves.jpg"

    [wallpaper.monitors.DP-10]
    path = "/home/hacky/Pictures/Wallpapers/art_flowers.png"

    [wallpaper.monitors.DP-5]
    path = "/home/hacky/Pictures/Wallpapers/retro_wave_2.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/hacky/Pictures/Wallpapers/waves.jpg"

    [wallpaper.monitors.eDP-2]
    path = "/home/hacky/Pictures/Wallpapers/mr_robot_2.png"

[widget.active_window]
colorize_icons = true

[widget.audio_visualizer]
show_when_idle = true

[widget.cat]
type = "noctalia/bongocat:cat"

[widget.clock]
format = "{:%a %b %d - %l:%M %p}"

[widget.control-center]
custom_image = "/home/hacky/Pictures/Icons/nixos.svg"
custom_image_colorize = true
scale = 1.2

[widget.session]
scale = 1.2

[widget.taskbar]
colorize_icons = true

[widget.tray]
colorize_icons = true

[widget.workspaces]
colorize_icons = true
