[audio]
colorize_icons = true

[bar.default]
background_opacity = 0.90999997965991497
center = [ "clock", "notifications" ]
concave_edge_corners = false
end = [ "tray", "network", "bluetooth", "volume", "brightness", "battery", "control-center", "session" ]
font_scale = 0.98999998532235622
margin_ends = 0
padding = 16
radius = 0
shadow = false
start = [ "workspaces", "wallpaper", "audio_visualizer" ]
thickness = 36
widget_spacing = 8

[desktop_widgets]
enabled = false

[dock]
colorize_icons = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [
    "lockscreen-login-box@DP-10",
    "lockscreen-login-box@DP-3",
    "lockscreen-login-box@eDP-1",
    "lockscreen-login-box@eDP-2",
    "lockscreen-login-box@DP-5",
    "lockscreen-login-box@WAYLAND-1"
