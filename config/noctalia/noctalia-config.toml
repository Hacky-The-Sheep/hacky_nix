[notification]
background_opacity = 0.88999998010694981
position = "top_center"
scale = 1.0500000081956387

[plugins]
enabled = [ "noctalia/bongocat" ]

[shell]
font_family = "Iosevka"
ui_scale = 1.1000000089406967

    [shell.launcher]
    categories = false
    show_icons = false

    [shell.panel]
    transparency_mode = "glass"

[theme]
builtin = "Catppuccin"
community_palette = "Monochrome"
source = "community"

    [theme.templates]
    builtin_ids = [ "alacritty", "btop", "gtk3", "gtk4", "ghostty", "helix", "hyprland", "niri", "qt" ]
    community_ids = [ "claude-code", "brave", "brave-origin", "discord", "libreoffice", "obsidian", "fastfetch", "bat" ]

[wallpaper.default]
path = "/home/hacky/Pictures/Wallpapers/waves.jpg"

[wallpaper.last]
path = "/home/hacky/Pictures/Wallpapers/waves.jpg"

[wallpaper.monitors.DP-4]
path = "/home/hacky/Pictures/Wallpapers/waves.jpg"

[wallpaper.monitors.DP-5]
path = "/home/hacky/Pictures/Wallpapers/gracile.jpg"

[widget.audio_visualizer]
show_when_idle = true

[widget.cat]
type = "noctalia/bongocat:cat"

[widget.clock]
format = "{:%a %b %d -%l:%M %p}"

[widget.control-center]
custom_image = "/home/hacky/Pictures/Icons/nixos.svg"
custom_image_colorize = true
scale = 1.2

[widget.session]
scale = 1.2
